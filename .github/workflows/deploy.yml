name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          VITE_MAPTILER_API_KEY: ${{ secrets.VITE_MAPTILER_API_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_ABLY_AUTH_URL: ${{ vars.VITE_ABLY_AUTH_URL }}
          VITE_AD_CLIENT: ${{ secrets.VITE_AD_CLIENT }}
          VITE_AD_SLOT_DASHBOARD: ${{ secrets.VITE_AD_SLOT_DASHBOARD }}
          VITE_AD_SLOT_HISTORY: ${{ secrets.VITE_AD_SLOT_HISTORY }}

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
